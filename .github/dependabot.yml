# Dependabot: a weekly pull request when a Python package (uv.lock) or a GitHub Action has a newer version,
# and right away for a security fix. Review and merge like any PR; the tests and security checks run on it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      lint:  # their own pull request: a new version can flag new things, fixed in that PR (Tests → ruff-latest shows ruff's first)
        patterns: [ruff, shellcheck-py, zizmor]
      python:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
