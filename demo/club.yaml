# The demo club: invented people and data (demo/build.py), for screenshots, the video and previews without a club's data.
# Every name, callsign, email and phone here is made up: callsigns with a four-letter suffix are never issued,
# example.org is reserved, and 555-0100 to 555-0199 are reserved for fiction.

club:
  name: Example Radio Club
  callsign: W0DEMO
  meeting_day: Thursday
  meeting_time: "19:30"
  timezone: America/New_York
  invite_after_visits: 3
  public_calendars: [events]

auth:
  rp_id: localhost
  session_days: 180

admins: [N0JANE]

roster:
  source: app

links:
  - label: Video meeting
    url: https://meet.example.org/example-radio-club
  - label: Club website
    url: https://www.example.org/

offices:
  - President
  - Vice President
  - Secretary
  - Treasurer
  - {title: Trustee, officer: false, seats: 3}

modules:
  chow: true
calendar:
  holidays: us
  extra_holidays:
    - {name: Christmas Eve, month: 12, day: 24}
  elections: us

treasurer:
  certificate:
    name: Bond (Certificate of Indebtedness)
    short: bond
    note: Each member buys one bond within two years of joining; the club repays it if the club ever dissolves.

bylaws:
  refs:
    dues: VII
    bills: IV.C
    arrears: VII.B
    certificate: VII.D
    missed_chow: VII.F
  arrears_note: Under the bylaws (VII.B), the Board may suspend a member who is 8 weeks or more behind, after a written notice.
