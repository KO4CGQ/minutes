<script nonce="{{ csp_nonce }}">  // a details.multi list (Titles, Roles, a video room's roles): what's ticked, as pills, and a filter for a long list.
// Listening on the page, so a list added later (+ Add a room) works too.
document.querySelectorAll(".multi-filter").forEach((f) => { f.hidden = false; });
document.addEventListener("change", (e) => {
  const d = e.target.closest("details.multi");
  if (!d || e.target.type !== "checkbox") return;
  const sum = d.querySelector("summary"), on = [...d.querySelectorAll("input[type=checkbox]:checked")];
  // each ticked item as a pill, built as text: labels are never markup
  sum.replaceChildren(...(on.length ? on.map((b) => Object.assign(document.createElement("span"), {className: "chip", textContent: b.dataset.label || b.value}))
                                    : [sum.dataset.none]));
});
document.addEventListener("input", (e) => {
  if (!e.target.classList.contains("multi-filter")) return;
  const q = e.target.value.trim().toLowerCase();
  e.target.closest("details.multi").querySelectorAll("input[type=checkbox]").forEach((b) => {
    b.closest("label").hidden = q && !(b.dataset.label || b.value).toLowerCase().includes(q); });
});
</script>
